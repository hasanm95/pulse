syntax = "proto3";

package billing;

message HealthRequest {}
message HealthResponse {
  string status = 1;
}

message Plan {
  string id = 1;
  string name = 2;
  string provider_price_id = 3;
  int32 max_monitors = 4;
  int32 min_interval_seconds = 5;
}

message GetPlansRequest {}
message GetPlansResponse {
  repeated Plan plans = 1;
}

message SubscribeRequest {
  string org_id = 1;
  string plan_id = 2;
  string email = 3;
  string success_url = 4;
  string cancel_url = 5;
}
message SubscribeResponse {
  string checkout_url = 1;
}

message CancelSubscriptionRequest {
  string org_id = 1;
}
message CancelSubscriptionResponse {}

message GetUsageRequest {
  string org_id = 1;
}
message GetUsageResponse {
  string plan_id = 1;
  string plan_name = 2;
  int32 max_monitors = 3;
  int32 min_interval_seconds = 4;
}

message CheckLimitRequest {
  string org_id = 1;
  string limit_type = 2;
  int32 current_count = 3;
}
message CheckLimitResponse {
  bool allowed = 1;
  string reason = 2;
}

service BillingService {
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
  rpc GetPlans(GetPlansRequest) returns (GetPlansResponse);
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  rpc CheckLimit(CheckLimitRequest) returns (CheckLimitResponse);
}