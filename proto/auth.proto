syntax = "proto3";

package auth;

option go_package = "github.com/hasanm95/pulse/services/auth/proto;authpb";

message HealthRequest {}

message HealthResponse {
    string status = 1;
}

message SignupRequest {
  string org_name = 1;
  string email = 2;
  string password = 3;
}

message SignupResponse {
  string org_id = 1;
  string user_id = 2;
}


service AuthService {
    rpc HealthCheck(HealthRequest) returns (HealthResponse);
    rpc Signup(SignupRequest) returns (SignupResponse);
}