services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - AUTH_DB_NAME=${AUTH_DB_NAME}
      - MONITOR_CONFIG_DB_NAME=${MONITOR_CONFIG_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass $$REDIS_PASS 
    volumes:
      - redis_data:/data 
    healthcheck:
      test: ["CMD", "redis-cli", "-a", $$REDIS_PASS, "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./services/auth:/app
      - /app/tmp
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${AUTH_DB_NAME}
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
      - ./proto:/proto:ro
    environment:
      - NODE_ENV=development
      - AUTH_PROTO_PATH=/proto/auth.proto
      - AUTH_SERVICE_URL=auth:8080
      - MONITOR_CONFIG_SERVICE_URL=monitor-config:50052
      - MONITOR_CONFIG_PROTO_PATH=/proto/monitor-config.proto
    depends_on:
      - auth
      - monitor-config

  monitor-config:
    build:
      context: ./services/monitor-config
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    volumes:
      - ./services/monitor-config:/app
      - /app/node_modules
      - ./proto:/proto:ro
    environment:
      - NODE_ENV=development
      - MONITOR_CONFIG_PROTO_PATH=/proto/monitor-config.proto
      - MONITOR_CONFIG_SERVICE_URL=0.0.0.0:50052
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${MONITOR_CONFIG_DB_NAME}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  scheduler:
    build: 
      context: ./services/scheduler
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
    volumes:
      - ./services/scheduler:/app
      - /app/tmp 
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - REDIS_ADDR=redis:6379
      - REDIS_PASS=${REDIS_PASS}

volumes:
  pgdata:
  rabbitmq_data:
  redis_data: