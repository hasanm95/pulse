services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - AUTH_DB_NAME=${AUTH_DB_NAME}
      - MONITOR_CONFIG_DB_NAME=${MONITOR_CONFIG_DB_NAME}
      - RESULTS_STORE_DB_NAME=${RESULTS_STORE_DB_NAME}
      - ALERTING_DB_NAME=${ALERTING_DB_NAME}
      - STATUS_PAGE_DB_NAME=${STATUS_PAGE_DB_NAME}
      - BILLING_DB_NAME=${BILLING_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS}  
    volumes:
      - redis_data:/data 
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./services/auth:/app
      - /app/tmp
    environment:
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${AUTH_DB_NAME}
      - PORT=8080
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
      - ./proto:/proto:ro
    environment:
      - NODE_ENV=development
      - AUTH_PROTO_PATH=/proto/auth.proto
      - AUTH_SERVICE_URL=auth:8080
      - MONITOR_CONFIG_SERVICE_URL=monitor-config:50052
      - MONITOR_CONFIG_PROTO_PATH=/proto/monitor-config.proto
      - BILLING_SERVICE_URL=billing:50054
      - BILLING_PROTO_PATH=/proto/billing.proto
    depends_on:
      - auth
      - monitor-config
      - billing

  monitor-config:
    build:
      context: ./services/monitor-config
      dockerfile: Dockerfile
    ports:
      - "50052:50052"
    volumes:
      - ./services/monitor-config:/app
      - /app/node_modules
      - ./proto:/proto:ro
    environment:
      - NODE_ENV=development
      - MONITOR_CONFIG_PROTO_PATH=/proto/monitor-config.proto
      - MONITOR_CONFIG_SERVICE_URL=0.0.0.0:50052
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${MONITOR_CONFIG_DB_NAME}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  scheduler:
    build: 
      context: ./services/scheduler
      dockerfile: Dockerfile
    ports:
      - "50053:50053"
    volumes:
      - ./services/scheduler:/app
      - /app/tmp 
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - REDIS_ADDR=redis:6379
      - REDIS_PASS=${REDIS_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ./services/worker-pool
      dockerfile: Dockerfile
    volumes:
      - ./services/worker-pool:/app
      - /app/tmp
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - REDIS_ADDR=redis:6379
      - REDIS_PASS=${REDIS_PASS}
      - WORKER_CONCURRENCY=5
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
  results-store:
    build: 
      context: ./services/results-store
      dockerfile: Dockerfile
    volumes:
      - ./services/results-store:/app
      - /app/tmp
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${RESULTS_STORE_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  alerting:
    build: 
      context: ./services/alerting
      dockerfile: Dockerfile
    volumes:
      - ./services/alerting:/app
      - /app/tmp
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${ALERTING_DB_NAME}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  status-page:
    build:
      context: ./services/status-page
      dockerfile: Dockerfile
    volumes:
      - ./services/status-page:/app
      - /app/node_modules
    environment:
      - PORT=3005
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${STATUS_PAGE_DB_NAME}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "3005:3005"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  billing:
    build:
      context: ./services/billing
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
      - "50054:50054"
    volumes:
      - ./services/billing:/app
      - /app/node_modules
      - ./proto:/proto:ro
    environment:
      - PORT=3006
      - BILLING_GRPC_URL=0.0.0.0:50054
      - BILLING_PROTO_PATH=/proto/billing.proto
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${BILLING_DB_NAME}
      - PAYMENT_PROVIDER=mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq_data:
  redis_data: